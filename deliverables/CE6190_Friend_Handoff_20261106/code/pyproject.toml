[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ce6190-cachebench"
version = "0.2.0"
description = "SeaCache-based Wan 2.1 adaptive caching experiments"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["cachebench"]
package-dir = {cachebench = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
